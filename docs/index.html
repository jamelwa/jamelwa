<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work contributions · hungryfool-klg</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Hallmark · component: contribution graph · theme: Terminal · motion: none */
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 14px/1.5 var(--font-body); font-variant-numeric: tabular-nums; }
    main { max-width: 880px; margin: auto; padding: var(--space-md); }
    .year + .year { margin-top: var(--space-lg); }
    .year-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-xs); }
    h2 { margin: 0; font-size: 14px; font-weight: 400; }
    .year-meta { color: var(--color-muted); font-size: 12px; }
    .plot-scroll { overflow-x: auto; padding: var(--space-sm) var(--space-xs); }
    .plot { width: max-content; display: grid; grid-template-columns: 24px auto; gap: var(--space-sm); }
    .weekdays { display: grid; grid-template-rows: 20px repeat(7, var(--cell)); row-gap: var(--cell-gap); font-size: 10px; line-height: var(--cell); color: var(--color-muted); }
    .calendar { display: grid; gap: var(--cell-gap); grid-template-columns: repeat(var(--weeks), var(--cell)); grid-template-rows: 20px repeat(7, var(--cell)); }
    .month { font-size: 10px; color: var(--color-muted); white-space: nowrap; }
    .day, .future { width: var(--cell); height: var(--cell); border-radius: 2px; background: var(--color-empty); color: var(--color-ink); }
    .day { padding: 0; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .day:active { outline: 1px solid var(--color-focus); outline-offset: 1px; }
    .future { opacity: 0.3; }
    [data-level="1"] { background: var(--color-level-1); }
    [data-level="2"] { background: var(--color-level-2); }
    [data-level="3"] { background: var(--color-level-3); }
    [data-level="4"] { background: var(--color-level-4); }
    #tooltip { position: fixed; inset: auto; margin: 0; padding: var(--space-sm) var(--space-md); max-width: calc(100% - 16px); border: 1px solid var(--color-rule); border-radius: 4px; background: var(--color-panel); color: var(--color-ink); font-size: 12px; }
    #status { margin: 0; color: var(--color-muted); }
    #status[data-state="error"] { color: var(--color-error); }
    #retry { margin-top: var(--space-sm); padding: var(--space-sm) var(--space-md); min-height: 44px; border: 1px solid var(--color-rule); border-radius: 4px; background: var(--color-panel); color: var(--color-ink); font: inherit; cursor: pointer; }
    #retry:active { background: var(--color-empty); }
    :disabled { opacity: 0.5; cursor: not-allowed; }
    [hidden] { display: none !important; }
    @media (hover: hover) { .day:hover { outline: 1px solid var(--color-focus); outline-offset: 1px; } }
  </style>
</head>
<body>
  <main aria-label="Work contributions for hungryfool-klg">
    <p id="status" role="status" data-state="loading">Loading…</p>
    <button id="retry" type="button" hidden>Retry</button>
    <div id="charts" aria-busy="true"></div>
    <noscript>Enable JavaScript to view the graph.</noscript>
  </main>
  <div id="tooltip" role="tooltip" popover="manual"></div>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const number = new Intl.NumberFormat('en-US');
    const prettyDate = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric' });
    const parseDate = value => new Date(`${value}T00:00:00Z`);
    const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(+parseDate(value)) && parseDate(value).toISOString().slice(0, 10) === value;
    let active = null, hoverTimer, hideTimer;

    function validate(snapshot) {
      if (snapshot.username !== 'hungryfool-klg' || !validDate(snapshot.asOf) || !Array.isArray(snapshot.years) || !snapshot.years.length) throw Error('Invalid snapshot metadata');
      const dates = new Set(), years = new Set();
      for (const year of snapshot.years) {
        if (!Number.isInteger(year.year) || year.year < 2008 || year.year > Number(snapshot.asOf.slice(0, 4)) || years.has(year.year) || !Array.isArray(year.days) || !year.days.length) throw Error('Invalid year');
        years.add(year.year);
        let total = 0;
        for (const day of year.days) {
          if (!validDate(day.date) || !day.date.startsWith(`${year.year}-`) || day.date > snapshot.asOf || dates.has(day.date) || !Number.isSafeInteger(day.count) || day.count < 0 || !Number.isInteger(day.level) || day.level < 0 || day.level > 4 || (day.count === 0) !== (day.level === 0)) throw Error('Invalid daily count');
          dates.add(day.date); total += day.count;
        }
        if (total !== year.total) throw Error('Annual total does not match daily counts');
        const end = year.year === Number(snapshot.asOf.slice(0, 4)) ? parseDate(snapshot.asOf) : new Date(Date.UTC(year.year, 11, 31));
        if (year.days.length !== (end - new Date(Date.UTC(year.year, 0, 1))) / 86400000 + 1) throw Error('Incomplete daily calendar');
      }
      return snapshot;
    }

    function render(data) {
      const days = new Map(data.years.flatMap(y => y.days).map(d => [d.date, d]));
      $('charts').replaceChildren();
      $('charts').setAttribute('aria-label', `GitHub snapshot through ${data.asOf} UTC`);
      for (const year of data.years.sort((a, b) => b.year - a.year)) {
        const section = document.createElement('section'); section.className = 'year';
        section.setAttribute('aria-labelledby', `heading-${year.year}`);
        section.innerHTML = `<div class="year-head"><h2 id="heading-${year.year}">${year.year}</h2><span class="year-meta">${number.format(year.total)} contributions</span></div><div class="plot-scroll"><div class="plot"><div class="weekdays" aria-hidden="true"><span style="grid-row:3">Mon</span><span style="grid-row:5">Wed</span><span style="grid-row:7">Fri</span></div><div class="calendar" role="group" aria-label="${year.year} daily contributions"></div></div></div>`;
        const calendar = section.querySelector('.calendar');
        const start = new Date(Date.UTC(year.year, 0, 1)), offset = start.getUTCDay();
        const length = (new Date(Date.UTC(year.year + 1, 0, 1)) - start) / 86400000;
        calendar.style.setProperty('--weeks', Math.ceil((length + offset) / 7));
        for (let i = 0; i < length; i++) {
          const date = new Date(+start + i * 86400000), key = date.toISOString().slice(0, 10);
          const column = Math.floor((offset + i) / 7) + 1, row = (offset + i) % 7 + 2;
          if (date.getUTCDate() === 1) {
            const month = document.createElement('span'); month.className = 'month';
            month.textContent = date.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' });
            month.style.gridColumn = column; month.style.gridRow = 1; month.setAttribute('aria-hidden', 'true'); calendar.append(month);
          }
          const day = days.get(key), cell = document.createElement(day ? 'button' : 'span');
          cell.style.gridColumn = column; cell.style.gridRow = row;
          if (day) {
            cell.className = 'day'; cell.type = 'button'; cell.dataset.date = key; cell.dataset.level = day.level;
            cell.tabIndex = i === 0 ? 0 : -1;
            cell.setAttribute('aria-label', `${prettyDate.format(date)} · ${day.count} contribution${day.count === 1 ? '' : 's'}`);
          } else { cell.className = 'future'; cell.setAttribute('aria-hidden', 'true'); }
          calendar.append(cell);
        }
        $('charts').append(section);
      }
    }

    function hideTooltip() {
      clearTimeout(hoverTimer); clearTimeout(hideTimer);
      if (active) active.removeAttribute('aria-describedby');
      active = null; $('tooltip').hidePopover();
    }
    function positionTooltip() {
      if (!active) return;
      const box = active.getBoundingClientRect(), clip = active.closest('.plot-scroll').getBoundingClientRect();
      if (box.right < clip.left || box.left > clip.right || box.bottom < 0 || box.top > innerHeight) return hideTooltip();
      const tip = $('tooltip'), rect = tip.getBoundingClientRect();
      tip.style.left = `${Math.max(8, Math.min(innerWidth - rect.width - 8, box.left + box.width / 2 - rect.width / 2))}px`;
      tip.style.top = `${Math.max(8, box.top >= rect.height + 8 ? box.top - rect.height - 8 : Math.min(innerHeight - rect.height - 8, box.bottom + 8))}px`;
    }
    function showTooltip(cell) {
      hideTooltip(); active = cell;
      $('tooltip').textContent = cell.getAttribute('aria-label');
      cell.setAttribute('aria-describedby', 'tooltip');
      $('tooltip').showPopover(); positionTooltip();
    }

    async function load() {
      $('status').hidden = false; $('status').textContent = 'Loading…'; $('status').dataset.state = 'loading';
      $('retry').hidden = true; $('charts').setAttribute('aria-busy', 'true');
      try {
        const response = await fetch('contributions.json', { signal: AbortSignal.timeout(15000) });
        if (!response.ok) throw Error(`Snapshot HTTP ${response.status}`);
        render(validate(await response.json()));
        $('status').dataset.state = 'success'; $('status').hidden = true;
      } catch {
        $('status').textContent = 'Couldn’t load contribution data.'; $('status').dataset.state = 'error'; $('retry').hidden = false;
      } finally { $('charts').setAttribute('aria-busy', 'false'); }
    }
    $('retry').addEventListener('click', load);
    document.addEventListener('click', e => {
      if (e.target.matches('.day')) showTooltip(e.target);
      else if (!$('tooltip').contains(e.target)) hideTooltip();
    });
    $('charts').addEventListener('focusin', e => {
      if (!e.target.matches('.day')) return;
      e.target.closest('.calendar').querySelectorAll('.day').forEach(cell => cell.tabIndex = cell === e.target ? 0 : -1);
      showTooltip(e.target);
    });
    $('charts').addEventListener('focusout', e => { if (e.target === active) hideTooltip(); });
    $('charts').addEventListener('pointerover', e => {
      clearTimeout(hoverTimer); clearTimeout(hideTimer);
      if (e.pointerType === 'mouse' && e.target.matches('.day')) hoverTimer = setTimeout(() => showTooltip(e.target), 800);
    });
    $('charts').addEventListener('pointerout', e => {
      clearTimeout(hoverTimer);
      if (e.pointerType === 'mouse' && e.target === active) hideTimer = setTimeout(hideTooltip, 300);
    });
    $('tooltip').addEventListener('pointerenter', () => clearTimeout(hideTimer));
    $('tooltip').addEventListener('pointerleave', hideTooltip);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTooltip(); });
    document.addEventListener('scroll', positionTooltip, true);
    window.addEventListener('resize', positionTooltip);
    $('charts').addEventListener('keydown', e => {
      if (!e.target.matches('.day')) return;
      const cells = [...e.target.closest('.calendar').querySelectorAll('.day')], index = cells.indexOf(e.target);
      const steps = { ArrowLeft: -7, ArrowRight: 7, ArrowUp: -1, ArrowDown: 1, Home: -index, End: cells.length - index - 1 };
      if (!(e.key in steps)) return;
      e.preventDefault(); cells[Math.max(0, Math.min(cells.length - 1, index + steps[e.key]))].focus();
    });
    load();
  </script>
</body>
</html>
